version: '3.8'

services:
  # Конфигурация для Python-проекта (например, Flask/Django)
  pageflip-book:
    image: python:3.11-slim
    container_name: pageflip-book
    working_dir: /app

    command: >
      sh -c "
      # --- ВАЖНО ---
      # Замените этот блок на реальные команды для вашего приложения.
      #
      # Пример для Flask-приложения:
      # pip install --no-cache-dir -r requirements.txt && \
      # gunicorn --bind 0.0.0.0:5000 app:app
      echo 'Пожалуйста, укажите команду для запуска вашего Python-приложения.'
      "

    ports:
      - "8080:80"

    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET KEY must be set}

    env_file:
      - .env

    restart: unless-stopped

  # Конфигурация для статического сайта с использованием вашего Dockerfile
  static-site-nginx:
    build: .
    container_name: static-site-nginx

    ports:
      - "${PORT:-80}:80" # Порт хоста : порт контейнера

    volumes:
      - ./:/app # Монтируем папку проекта для "горячей" перезагрузки

    restart: unless-stopped
