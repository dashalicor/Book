version: '3.8'

services:
  book:
    image: nginx:alpine
    container_name: book-app
    working_dir: /app
    ports:
      - "8080:80"
    restart: unless-stopped
    command: >
      sh -c "
      apk add --no-cache git &&
      rm -rf /var/cache/apk/* &&
      rm -rf /usr/share/nginx/html/* &&
      git clone --depth 1 https://github.com/dashalicor/Book.git /tmp/repo &&
      cp -a /tmp/repo/. /usr/share/nginx/html/ &&
      rm -rf /tmp/repo &&
      nginx -g 'daemon off;'
      "
